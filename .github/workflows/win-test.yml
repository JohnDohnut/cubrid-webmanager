# Windows package test, started by hand (workflow_dispatch) on the fork.
# Builds the Windows packages of `ref` on a Windows runner, or takes the
# packages of an earlier run, then on clean runners:
#   - desktop: installs the setup.exe silently and drives the installed app,
#     runs the unpacked app as a portable one and the real portable.exe
#     (tools/win-test/desktop-test.cjs);
#   - server: installs the server setup.exe silently, checks the service, its
#     account and the data folder's ACL, starts it on a free port, upgrades it
#     while it runs, uninstalls it, and runs the zip from a folder
#     (tools/win-test/server-test.ps1).
# Screenshots, app and service logs and results.json are uploaded as artifacts.
#
# A push to the test branch runs the target in tools/win-test/target.json
# (a workflow that is only on a branch cannot be dispatched before it has
# run once); workflow_dispatch takes the same values as inputs.
name: Windows package test

on:
  push:
    branches: ['test/win-desktop']
    paths: ['.github/workflows/win-test.yml', 'tools/win-test/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build and test'
        required: true
        default: 'chore/deps-node-upgrade'
      reuse_run_id:
        description: 'Run id of this workflow whose packages to test again (skips the build)'
        required: false
        default: ''
      arm64:
        description: 'Also build the arm64 desktop packages and test them on windows-11-arm'
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  NX_DAEMON: 'false'

jobs:
  plan:
    name: Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      reuse_run_id: ${{ steps.plan.outputs.reuse_run_id }}
      arm64: ${{ steps.plan.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_REUSE: ${{ inputs.reuse_run_id }}
          INPUT_ARM64: ${{ inputs.arm64 }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ref="$INPUT_REF"; reuse="$INPUT_REUSE"; arm64="$INPUT_ARM64"
          else
            ref="$(jq -r '.ref' tools/win-test/target.json)"
            reuse="$(jq -r '.reuse_run_id // ""' tools/win-test/target.json)"
            arm64="$(jq -r '.arm64' tools/win-test/target.json)"
          fi
          # actions/checkout takes a branch, a tag or a full commit hash, not a short one:
          # resolve the ref to the commit, which also pins a branch to its head of now.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" -q .sha)"
          echo "ref=$ref -> $sha, reuse_run_id=$reuse, arm64=$arm64"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "reuse_run_id=$reuse" >> "$GITHUB_OUTPUT"
          echo "arm64=$arm64" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build desktop packages
    needs: [plan]
    if: needs.plan.outputs.reuse_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout ${{ needs.plan.outputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          # commit_num in the version counts commits: needs the full history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Version
        shell: bash
        run: |
          echo "Version $(node scripts/product-version.cjs) at $(git rev-parse HEAD)"

      - name: Install dependencies
        run: npm ci

      # nx is called by its entry file: `npx nx` and `npm run` (cmd.exe) find
      # the repository's nx.bat wrapper first, which wants .nx/installation.
      # The nx target's command starts with CSC_IDENTITY_AUTO_DISCOVERY=false
      # (a POSIX env prefix): it may not run on a Windows host. Try it, and
      # fall back to electron-builder itself with the same settings.
      - name: Package desktop (nx target)
        id: nxpkg
        continue-on-error: true
        shell: bash
        run: node node_modules/nx/bin/nx.js run desktop:package -- --win --x64 ${{ needs.plan.outputs.arm64 == 'true' && '--arm64' || '' }}

      - name: Package desktop (electron-builder directly, the nx target failed on this host)
        if: steps.nxpkg.outcome == 'failure'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node node_modules/nx/bin/nx.js run desktop:prepare-app
          node node_modules/nx/bin/nx.js run api-server:build
          node node_modules/nx/bin/nx.js run web-manager:build-electron
          npx electron-builder --config apps/desktop/electron-builder.config.cjs --publish never --win --x64 ${{ needs.plan.outputs.arm64 == 'true' && '--arm64' || '' }}

      - name: List packages
        shell: bash
        run: ls -l dist/portable

      - name: Upload x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            dist/portable/*-windows-x64-setup.exe
            dist/portable/*-windows-x64-portable.exe
            dist/portable/win-unpacked/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 5

      - name: Upload arm64 packages
        if: needs.plan.outputs.arm64 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-arm64
          path: |
            dist/portable/*-windows-arm64-setup.exe
            dist/portable/*-windows-arm64-portable.exe
            dist/portable/win-arm64-unpacked/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 5

  build-server:
    name: Build server packages
    needs: [plan]
    if: needs.plan.outputs.reuse_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ${{ needs.plan.outputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # package.json's package:server:win, with nx called by its entry file
      # (`npm run` goes through cmd.exe, which finds the repository's nx.bat
      # wrapper first).
      - name: Build the server executable and installer
        shell: bash
        run: |
          node node_modules/nx/bin/nx.js build web-manager
          node node_modules/nx/bin/nx.js run api-server:build:exe:windows
          node scripts/assemble-package.mjs win
          node scripts/package-server-installers.mjs

      # scripts/archive-packages.mjs needs `zip` on PATH; without it the zip is
      # packed here with the same layout (<name>/cubrid-admin.exe, <name>/conf/...).
      - name: Pack the server zip
        shell: bash
        run: |
          version="$(node scripts/product-version.cjs)"
          mkdir -p dist/release
          if command -v zip >/dev/null 2>&1; then
            node scripts/archive-packages.mjs
          else
            echo "::warning::zip is not on PATH: the server zip is packed by this workflow with the release layout, not by scripts/archive-packages.mjs"
            name="CUBRID-Admin-server-$version-windows-x64"
            rm -rf "dist/release/$name"
            mkdir -p "dist/release/$name/conf"
            cp dist/executables/cubrid-admin.exe "dist/release/$name/"
            cp dist/executables/conf/cwm.conf.sample dist/executables/conf/cwm.conf.reference.md "dist/release/$name/conf/"
            (cd dist/release && 7z a -tzip -r "$name.zip" "$name" >/dev/null)
            rm -rf "dist/release/$name"
            cp dist/server-installers/*-windows-x64-setup.exe dist/release/
          fi
          ls -l dist/release

      - name: Upload server packages
        uses: actions/upload-artifact@v4
        with:
          name: server-windows-x64
          path: |
            dist/release/*-windows-x64.zip
            dist/release/*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

  test-desktop-x64:
    name: Test desktop (windows x64)
    needs: [plan, build-desktop]
    if: always() && needs.plan.result == 'success' && (needs.build-desktop.result == 'success' || needs.plan.outputs.reuse_run_id != '')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the test tools
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: packages
          run-id: ${{ needs.plan.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install Playwright
        working-directory: tools/win-test
        run: npm install --no-audit --no-fund

      - name: Test the packages
        shell: pwsh
        run: node tools/win-test/desktop-test.cjs --packages "${{ github.workspace }}\packages" --arch x64 --out "${{ github.workspace }}\out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-x64-results
          path: out/**
          if-no-files-found: warn

  test-desktop-arm64:
    name: Test desktop (windows arm64)
    needs: [plan, build-desktop]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.arm64 == 'true' && (needs.build-desktop.result == 'success' || needs.plan.outputs.reuse_run_id != '')
    runs-on: windows-11-arm
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout the test tools
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-arm64
          path: packages
          run-id: ${{ needs.plan.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install Playwright
        working-directory: tools/win-test
        run: npm install --no-audit --no-fund

      - name: Test the packages
        shell: pwsh
        run: node tools/win-test/desktop-test.cjs --packages "${{ github.workspace }}\packages" --arch arm64 --out "${{ github.workspace }}\out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-arm64-results
          path: out/**
          if-no-files-found: warn

  test-server:
    name: Test server (windows x64)
    needs: [plan, build-server]
    if: always() && needs.plan.result == 'success' && (needs.build-server.result == 'success' || needs.plan.outputs.reuse_run_id != '')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the test tools
        uses: actions/checkout@v4

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: server-windows-x64
          path: packages
          run-id: ${{ needs.plan.outputs.reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Test the packages
        shell: pwsh
        run: tools/win-test/server-test.ps1 -Packages "${{ github.workspace }}\packages" -Out "${{ github.workspace }}\out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-results
          path: out/**
          if-no-files-found: warn
