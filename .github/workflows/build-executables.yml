# CI: GitHub에 push/PR 올리면 여기서 자동 실행 → Actions 탭에서 성공(초록)/실패(빨강) 확인
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck api-server
        run: npx tsc -p apps/api-server/tsconfig.app.json --noEmit

      - name: Build all projects
        run: npx nx run-many --target=build --all

      # Artifact: Nx 빌드 산출물(dist만, main.js 등). 공식 저장소 develop 직접 push 시에만.
      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'cubrid/cubrid-webmanager'
        uses: actions/upload-artifact@v4
        with:
          name: cubrid-webmanager-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
